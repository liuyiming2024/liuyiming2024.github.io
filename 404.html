<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
    <!-- Q-Chat-S-131（外部报告 F-2）：内容安全策略。
         GitHub Pages 设不了 HTTP 响应头，只能用 meta 标签 ——
         它能覆盖绝大多数指令（frame-ancestors / report-uri 除外）。

         作用：页面被注入外部脚本时，浏览器直接拒绝加载。
         本站无任何第三方 JS 依赖，所以 default-src 'self' 就够了。

         ⚠ 为什么 script-src 保留了 'unsafe-inline'：
            这些页面都有内联 <script> 初始化代码（共 7 处）。
            要去掉它得改用 nonce 或 hash，而 hash 每次改代码都要重算 ——
            维护性差，容易在改完后静默失效（脚本被拦、页面白屏）。
            保留 'unsafe-inline' **仍能挡住外部域的脚本注入**，
            那是 XSS 的主要危害形式；内联代码是我们自己写的，不是注入的。

         ⚠ connect-src 必须放行 Supabase —— 身份服务要调它。
            写成 'self' 的话登录/权限页直接全部失效。
         ⚠ img-src 要放行 data:/blob: —— 头像是 canvas 生成的 data URL。 -->
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; connect-src 'self' https://pimryrsxkwyafmponegp.supabase.co; font-src 'self' data:; base-uri 'self'; form-action 'self'">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>正在跳转…</title>
<style>
  body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;
       font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;
       background:#f5f5f5;color:#191919}
  .box{text-align:center;padding:32px}
  .sp{width:22px;height:22px;border:2px solid #d0d0d0;border-top-color:#3b7ff2;
      border-radius:50%;margin:0 auto 14px;animation:r .7s linear infinite}
  @keyframes r{to{transform:rotate(360deg)}}
  a{color:#3b7ff2}
  .hint{margin-top:14px;font-size:13px;color:#8c8c8c;line-height:1.7}

/* ==========================================================================
   fx-plus.css · 视觉效果增强
   全部引用自样式库：liuyiming2024/css_effect_map_collection
     · 毛玻璃效果/index.html    → backdrop-filter 毛玻璃顶栏 / 浮层
     · 滚动指示器/index.html    → 顶部滚动进度条
     · css边框四角/index.html   → 卡片四角装饰线
     · 纯css气泡背景/index.css  → Hero 区上浮气泡背景

   设计约束：
     1. 只做「追加」，不改动站点原有任何一条规则；
     2. 不接管主题 —— 各站点已有自己的亮暗方案（Cloud / Code 用
        [data-theme="dark"]，Chat / 主页用 body.dark），本文件只对
        这两种写法各补一份深色取值，不新增第三套机制；
     3. 效果所需 DOM 由 fx-plus.js 注入，不要求改页面结构。
   ========================================================================== */

/* ---------- 1. 毛玻璃效果（样式库：毛玻璃效果/index.html）---------- */
/* 顶栏 / 导航：半透明 + 背景模糊，滚动时内容从下方透出 */
.nav, #topbar, .glass {
  -webkit-backdrop-filter: blur(20px) saturate(160%);
  backdrop-filter: blur(20px) saturate(160%);
  background: rgba(255, 255, 255, .72);
}
/* 侧栏与浮层用弱一档的模糊 */
.sidebar, #sidebar, .modal, .dropdown {
  -webkit-backdrop-filter: blur(14px);
  backdrop-filter: blur(14px);
}
/* 深色取值：同时兼容 [data-theme="dark"] 与 body.dark 两种既有写法 */
html[data-theme="dark"] .nav,
html[data-theme="dark"] #topbar,
html[data-theme="dark"] .glass,
body.dark .nav,
body.dark #topbar,
body.dark .glass {
  background: rgba(23, 27, 34, .72);
}
html[data-theme="dark"] .sidebar,
html[data-theme="dark"] #sidebar,
html[data-theme="dark"] .modal,
html[data-theme="dark"] .dropdown,
body.dark .sidebar,
body.dark #sidebar,
body.dark .modal,
body.dark .dropdown {
  background: rgba(23, 27, 34, .88);
}

/* ---------- 2. 滚动指示器（样式库：滚动指示器/index.html）---------- */
#scroll-progress {
  position: fixed;
  top: 0;
  left: 0;
  height: 3px;
  width: 0;
  z-index: 9999;
  background: linear-gradient(90deg, var(--brand, #3b7ff2), #7ee787);
  pointer-events: none;
  transition: width .08s linear;
}

/* ---------- 3. CSS 边框四角（样式库：css边框四角/index.html）---------- */
/* 伪元素实现四角各画两条 1px 短线，不需要改 DOM */
.corner-box { position: relative; }
.corner-box::before {
  content: "";
  position: absolute;
  inset: 0;
  pointer-events: none;
  --c: var(--brand, #3b7ff2);
  background:
    linear-gradient(var(--c), var(--c)) 0    0    / 14px 1px no-repeat,
    linear-gradient(var(--c), var(--c)) 0    0    / 1px 14px no-repeat,
    linear-gradient(var(--c), var(--c)) 100% 0    / 14px 1px no-repeat,
    linear-gradient(var(--c), var(--c)) 100% 0    / 1px 14px no-repeat,
    linear-gradient(var(--c), var(--c)) 0    100% / 14px 1px no-repeat,
    linear-gradient(var(--c), var(--c)) 0    100% / 1px 14px no-repeat,
    linear-gradient(var(--c), var(--c)) 100% 100% / 14px 1px no-repeat,
    linear-gradient(var(--c), var(--c)) 100% 100% / 1px 14px no-repeat;
  opacity: .5;
  transition: opacity .2s ease;
}
.corner-box:hover::before { opacity: 1; }

/* ---------- 4. 纯 CSS 气泡背景（样式库：纯css气泡背景/index.css）---------- */
.hero { position: relative; overflow: hidden; }
.bubble-bgwall {
  position: absolute;
  inset: 0;
  margin: 0;
  padding: 0;
  overflow: hidden;
  list-style: none;
  pointer-events: none;
  z-index: 0;
}
.bubble-bgwall li {
  position: absolute;
  bottom: -60px;
  display: block;
  width: 22px;
  height: 22px;
  border-radius: 6px;
  background-color: rgba(59, 127, 242, .16);
  animation: bubble-up 16s linear infinite;
}
html[data-theme="dark"] .bubble-bgwall li,
body.dark .bubble-bgwall li { background-color: rgba(125, 179, 255, .20); }

.bubble-bgwall li:nth-child(1)  { left: 10%; animation-duration: 15s; }
.bubble-bgwall li:nth-child(2)  { left: 20%; width: 34px; height: 34px; animation-duration: 11s; animation-delay: 2s; }
.bubble-bgwall li:nth-child(3)  { left: 25%; animation-duration: 13s; animation-delay: 4s; }
.bubble-bgwall li:nth-child(4)  { left: 40%; width: 28px; height: 28px; animation-duration: 9s; }
.bubble-bgwall li:nth-child(5)  { left: 70%; animation-duration: 14s; animation-delay: 1s; }
.bubble-bgwall li:nth-child(6)  { left: 80%; width: 40px; height: 40px; animation-duration: 12s; animation-delay: 3s; }
.bubble-bgwall li:nth-child(7)  { left: 32%; width: 46px; height: 46px; animation-duration: 17s; animation-delay: 2s; }
.bubble-bgwall li:nth-child(8)  { left: 55%; width: 18px; height: 18px; animation-duration: 15s; animation-delay: 4s; }
.bubble-bgwall li:nth-child(9)  { left: 25%; width: 20px; height: 20px; animation-duration: 12s; animation-delay: 2s; }
.bubble-bgwall li:nth-child(10) { left: 85%; width: 44px; height: 44px; animation-duration: 16s; animation-delay: 5s; }

@keyframes bubble-up {
  0%   { opacity: 0;   transform: translateY(0)      rotate(0deg); }
  15%  { opacity: .65; }
  50%  { opacity: .85; transform: translateY(-55vh)  rotate(90deg); }
  100% { opacity: 0;   transform: translateY(-110vh) rotate(180deg); }
}
/* 让 Hero 里原有内容浮在气泡之上 */
.hero > *:not(.bubble-bgwall) { position: relative; z-index: 1; }

/* ---------- 5. 尊重系统的减弱动效偏好 ---------- */
@media (prefers-reduced-motion: reduce) {
  .bubble-bgwall { display: none; }
  .corner-box::before { transition: none; }
}

</style>
</head>
<body>
<div class="box">
  <div class="sp" id="sp"></div>
  <div id="msg">正在跳转…</div>
  <div class="hint" id="hint" hidden>
    没有自动跳转？<a id="link" href="./">点这里继续</a>
  </div>
</div>
<script>
/* ================================================================
   404.html —— 路径大小写归一化（Q-Site-S-121）

   背景：GitHub Pages 的路径**大小写敏感**。
     https://liuyiming2024.github.io/Chat/      ✅ 能开
     https://liuyiming2024.github.io/chat/      ❌ 404
   而用户手打、聊天软件里传链接、二维码扫描，几乎必然会出现小写。
   于是"链接发过去对方打不开"成了常态，且对方只会以为链接坏了。

   原理：GitHub Pages 对本仓库未匹配的路径会**渲染 404.html**
   （状态码仍是 404，但内容会执行）。这里的脚本读取 location.pathname，
   与已知项目名做大小写不敏感匹配，命中就用 location.replace 跳到正确路径。

   ⚠⚠ 三条硬约束，改这个文件时必须守住：

   1. **只跳白名单**。映射表是写死的，绝不拿用户输入直接拼路径。
      否则这就是一个开放重定向：/404.html 能跳到任意 URL，
      会被拿去做钓鱼（域名看着是你的，内容却是别人的）。

   2. **保留子路径与查询串**。/chat/chat/index.html 要跳到
      /Chat/chat/index.html，不能把后面半截丢掉 ——
      丢了就变成"跳了但还是打不开"，比不跳更让人困惑。

   3. **失败要给人看得见的出路**。脚本出错、或压根没命中映射表时，
      必须显示一个可点的返回链接，不能留一张永远转圈的空白页。
      上面 .hint 默认隐藏，只在 3 秒后仍未跳转时才显示 ——
      正常跳转瞬间完成，不该让用户看到这个提示。

   另：仓库根路径不存在（比如 /archiveX/）时不跳，只给出返回主页的链接。
   猜错路径比不跳更糟 —— 把人送到一个无关页面，他会以为进错了站。
================================================================ */

/* 小写 → 真实路径。值必须与仓库实际大小写完全一致，否则白跳一次。 */
var MAP = {
  'chat':    'Chat',
  'code':    'Code',
  'archive': 'Archive',
  'assets':  'assets',
  'tool':    'Tool',
  'site':    'site'
};

function go() {
  var p = location.pathname;
  var q = location.search + location.hash;

  /* ⚠ 不能 filter 掉空串再 join：那会吃掉尾斜杠。
     /chat/ 本该跳到 /Chat/，丢了斜杠就变成 /Chat ——
     GitHub Pages 会再 301 一次才到，多一跳不说，
     路径里要是有目录，重定向还可能把相对资源路径算错。
     所以按 '/' 原样切分，只替换第一个非空段。 */
  var segs = p.split('/');                       // '/chat/' → ['', 'chat', '']
  if (segs.length < 2 || segs[1] === '') { fallback('./'); return; }

  var first = segs[1];
  var real = MAP[first.toLowerCase()];

  if (!real) { fallback('./'); return; }          // 不在白名单 → 只给返回主页
  /* 大小写本就对却走到 404，说明是别的原因（文件真的不存在）。
     这时不能再猜，只给返回链接 —— 把人送到无关页面比不跳更糟。 */
  /* ⚠ 这里必须补回分隔符：slice(2) 已经把第一个 '/' 切掉了，
     直接拼接会得到 './assetsstyle.css' —— 一个根本不存在的路径。
     跳错比不跳更糟：用户看到的不是 404，而是一个莫名其妙的空页面。 */
  if (real === first) {
    fallback('./' + first + (segs.length > 2 ? '/' + segs.slice(2).join('/') : '') + q);
    return;
  }

  segs[1] = real;
  var target = '.' + segs.join('/') + q;
  show(target);
  location.replace(target);
}

/* 兜底：给出可点的返回链接。3 秒后才显示，避免正常跳转时闪一下。 */
function fallback(href) {
  show(href);
  setTimeout(function () {
    document.getElementById('sp').style.display = 'none';
    document.getElementById('msg').textContent = '这个地址打不开';
    document.getElementById('hint').hidden = false;
    document.getElementById('hint').firstChild.textContent = '返回项目主页：';
  }, 3000);
}

function show(href) {
  var a = document.getElementById('link');
  if (a && href) a.href = href;
}

try { go(); } catch (e) { fallback('./'); }
</script>
<script>
/* ==========================================================================
   fx-plus.js · 为 fx-plus.css 注入效果所需 DOM
   引用自样式库：liuyiming2024/css_effect_map_collection
     · 滚动指示器  → 顶部进度条
     · 纯css气泡背景 → Hero 区气泡 <ul><li>
     · css边框四角  → 给 .card 加 .corner-box

   刻意不碰主题：各站点已有自己的亮暗切换（Cloud / Code 用
   [data-theme="dark"]，Chat / 主页用 body.dark），这里不接管、
   不创建第二个切换按钮、不写 localStorage 的主题键。
   ========================================================================== */
(function () {
  "use strict";

  function boot() {
    injectProgressBar();
    injectBubbles();
    markCorners();
    bindScroll();
  }
  if (document.readyState === "loading") {
    document.addEventListener("DOMContentLoaded", boot);
  } else {
    boot();
  }

  /* ---- 滚动指示器（样式库：滚动指示器） ---- */
  function injectProgressBar() {
    if (document.getElementById("scroll-progress")) return;
    var bar = document.createElement("div");
    bar.id = "scroll-progress";
    document.body.appendChild(bar);
  }
  function bindScroll() {
    var bar = document.getElementById("scroll-progress");
    if (!bar) return;
    var ticking = false;
    function update() {
      var h = document.documentElement.scrollHeight - window.innerHeight;
      var pct = h > 0 ? Math.min(100, (window.scrollY / h) * 100) : 0;
      bar.style.width = pct.toFixed(2) + "%";
      ticking = false;
    }
    function onScroll() {
      if (!ticking) { ticking = true; window.requestAnimationFrame(update); }
    }
    window.addEventListener("scroll", onScroll, { passive: true });
    window.addEventListener("resize", onScroll, { passive: true });
    update();
  }

  /* ---- 气泡背景（样式库：纯css气泡背景） ---- */
  function injectBubbles() {
    var hero = document.querySelector(".hero");
    if (!hero || hero.querySelector(".bubble-bgwall")) return;
    var ul = document.createElement("ul");
    ul.className = "bubble-bgwall";
    ul.setAttribute("aria-hidden", "true");
    for (var i = 0; i < 10; i++) ul.appendChild(document.createElement("li"));
    hero.insertBefore(ul, hero.firstChild);
  }

  /* ---- 四角装饰（样式库：css边框四角），只作用于卡片 ---- */
  function markCorners() {
    var cards = document.querySelectorAll(".card");
    for (var i = 0; i < cards.length; i++) cards[i].classList.add("corner-box");
  }
})();

</script>
</body>
</html>
