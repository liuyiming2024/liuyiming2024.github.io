    <!-- Q-Chat-S-131（外部报告 F-2）：内容安全策略。
         GitHub Pages 设不了 HTTP 响应头，只能用 meta 标签 ——
         它能覆盖绝大多数指令（frame-ancestors / report-uri 除外）。

         作用：页面被注入外部脚本时，浏览器直接拒绝加载。
         本站无任何第三方 JS 依赖，所以 default-src 'self' 就够了。

         ⚠ 为什么 script-src 保留了 'unsafe-inline'：
            这些页面都有内联 <script> 初始化代码（共 7 处）。
            要去掉它得改用 nonce 或 hash，而 hash 每次改代码都要重算 ——
            维护性差，容易在改完后静默失效（脚本被拦、页面白屏）。
            保留 'unsafe-inline' **仍能挡住外部域的脚本注入**，
            那是 XSS 的主要危害形式；内联代码是我们自己写的，不是注入的。

         ⚠ connect-src 必须放行 Supabase —— 身份服务要调它。
            写成 'self' 的话登录/权限页直接全部失效。
         ⚠ img-src 要放行 data:/blob: —— 头像是 canvas 生成的 data URL。 -->
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; connect-src 'self' https://pimryrsxkwyafmponegp.supabase.co; font-src 'self' data:; base-uri 'self'; form-action 'self'">

/* __INLINED__ 由 assets/style.css 生成，勿手改；改样式请改源文件后重跑 inline-css.py */
/* ==================================================================
 * 个人主页样式 —— 无外部依赖，全部使用系统字体
 * ================================================================== */
:root{
  --brand:#3b7ff2; --brand-dark:#2f6ad6; --brand-soft:#eaf2ff;
  --bg:#f4f6f9; --panel:#fff; --text:#1f2329; --dim:#6b7280;
  --border:#e5e8ec; --radius:10px;
}
body.dark{
  --brand:#4d8bf5; --brand-dark:#3b7ff2; --brand-soft:#1b2735;
  --bg:#101216; --panel:#171a1f; --text:#e6e6e6; --dim:#9aa0a6;
  --border:#2a2e35;
}
*{box-sizing:border-box}
body{
  margin:0; background:var(--bg); color:var(--text);
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
  font-size:15px; line-height:1.75; -webkit-text-size-adjust:100%;
}
a{color:var(--brand);text-decoration:none}
a:hover{text-decoration:underline}
code{background:var(--brand-soft);padding:1px 5px;border-radius:3px;font-family:ui-monospace,Menlo,Consolas,monospace;font-size:.9em}

/* 账号区（Q-Site-S-121）────────────────────────────────
   由 assets/identity.js 渲染。类名必须与 Chat/assets/site.css 那份
   完全一致：两边共用同一个脚本、同一套类，改一处就够。
   ⚠ 上次漏加了这一整段，账号区在页面上裸奔（无高宽、无头像圆形），
     而断言只检查了 index.html 有容器 —— "容器在、样式没加"抓不到。
     所以这次把 .acct-host 也写进锚点，两边一起验。 */
.acct-host { display: flex; align-items: center; gap: 8px; }
.acct-box  { display: flex; align-items: center; gap: 7px; }
.acct-av {
  width: 26px; height: 26px; border-radius: 50%;
  display: inline-flex; align-items: center; justify-content: center;
  color: #fff; font-size: 12px; font-weight: 600; flex: none;

@media(max-width:720px){

     实测 360px 视口下：nav-links 被压到 248px 宽、六个链接各 38px，

/* ==========================================================================
   fx-plus.css · 视觉效果增强
   全部引用自样式库：liuyiming2024/css_effect_map_collection
     · 毛玻璃效果/index.html    → backdrop-filter 毛玻璃顶栏 / 浮层

     2. 不接管主题 —— 各站点已有自己的亮暗方案（Cloud / Code 用
        [data-theme="dark"]，Chat / 主页用 body.dark），本文件只对
        这两种写法各补一份深色取值，不新增第三套机制；
     3. 效果所需 DOM 由 fx-plus.js 注入，不要求改页面结构。
   ========================================================================== */

/* ---------- 1. 毛玻璃效果（样式库：毛玻璃效果/index.html）---------- */

/* ⚠⚠ 这一段踩过一个真实的坑，删掉前务必先读：
   最初把 backdrop-filter 加在 #topbar 上，结果右上角「新建文件」菜单
   被侧栏盖住了 —— 点了没反应、被文件树遮在下面。

   根因：backdrop-filter 和 filter / transform 一样，会给元素同时创建
   ① 层叠上下文  ② 绝对定位后代的包含块。
   .top-menu 是 #topbar 的子元素，它的 z-index:60 本来是相对【根层叠
   上下文】算的（所以盖得住 z-index:55 的侧栏）；#topbar 一变成层叠上下
   文，这个 60 就被关在了 #topbar 内部，而 #topbar 自己在根上下文里相当
   于 0 —— 于是整个顶栏子树掉到侧栏下面。
   实测（Chromium + elementFromPoint）：
     加 backdrop-filter 前，菜单中心命中 BUTTON；加之后命中侧栏的 .name。

   修法：给 #topbar 显式 position + z-index，把整个顶栏子树抬回 60
   —— 正好是 .top-menu 原本的层级，相对顺序与改动前一致。
   注意：只加 position:relative 不够，z-index:auto 不抬层级，实测仍被盖。

   同类排查清单：以后给任何容器加 backdrop-filter / filter / transform /
   will-change 前，先确认它里面没有需要"浮出"去盖别的元素的子节点。 */

.nav, #topbar, .glass {
  -webkit-backdrop-filter: blur(20px) saturate(160%);
  backdrop-filter: blur(20px) saturate(160%);
  background: rgba(255, 255, 255, .72);
}
/* Code 的顶栏原本是 position:static、无 z-index，必须显式抬层级 */
#topbar {
  position: relative;
  z-index: 60;
}
/* 侧栏与浮层用弱一档的模糊（这些本来就是浮层，不存在"关住子节点"的问题） */
.sidebar, #sidebar, .modal, .dropdown {
  -webkit-backdrop-filter: blur(14px);
  backdrop-filter: blur(14px);
}
/* 深色取值：同时兼容 [data-theme="dark"] 与 body.dark 两种既有写法 */
html[data-theme="dark"] .nav,
html[data-theme="dark"] #topbar,
html[data-theme="dark"] .glass,
body.dark .nav,
body.dark #topbar,
body.dark .glass {
  background: rgba(23, 27, 34, .72);
}
html[data-theme="dark"] .sidebar,
html[data-theme="dark"] #sidebar,
html[data-theme="dark"] .modal,
html[data-theme="dark"] .dropdown,
body.dark .sidebar,
body.dark #sidebar,
body.dark .modal,
body.dark .dropdown {
  background: rgba(23, 27, 34, .88);
}

/* ---------- 2. 滚动指示器（样式库：滚动指示器/index.html）---------- */

/* ---------- 3. CSS 边框四角（样式库：css边框四角/index.html）---------- */
/* 伪元素实现四角各画两条 1px 短线，不需要改 DOM */
.corner-box { position: relative; }
.corner-box::before {
  content: "";
  position: absolute;
  inset: 0;
  pointer-events: none;
  border-radius: inherit;
  --c: var(--brand, #3b7ff2);
  background:
    linear-gradient(var(--c), var(--c)) 0    0    / 14px 1px no-repeat,
    linear-gradient(var(--c), var(--c)) 0    0    / 1px 14px no-repeat,
    linear-gradient(var(--c), var(--c)) 100% 0    / 14px 1px no-repeat,
    linear-gradient(var(--c), var(--c)) 100% 0    / 1px 14px no-repeat,
    linear-gradient(var(--c), var(--c)) 0    100% / 14px 1px no-repeat,
    linear-gradient(var(--c), var(--c)) 0    100% / 1px 14px no-repeat,
    linear-gradient(var(--c), var(--c)) 100% 100% / 14px 1px no-repeat,
    linear-gradient(var(--c), var(--c)) 100% 100% / 1px 14px no-repeat;
  opacity: .5;
  transition: opacity .2s ease;
}
.corner-box:hover::before { opacity: 1; }

/* ---------- 4. 纯 CSS 气泡背景（样式库：纯css气泡背景/index.css）---------- */
.hero { position: relative; overflow: hidden; }
.bubble-bgwall {
  position: absolute;
  inset: 0;
  margin: 0;
  padding: 0;
  overflow: hidden;
  list-style: none;
  pointer-events: none;
  z-index: 0;
}
/* ⚠ 第一版填充只有 .16 透明度的蓝，实测在浅色底上几乎看不见 ——
   白底 + 16% 蓝算出来的实际反差低于肉眼可辨阈值，等于白做。
   所以填充提到 .38，并加一道同色内描边：气泡上升时会经过文字后方，
   纯色块容易和文字糊在一起，有描边才有清晰的轮廓。 */
.bubble-bgwall li {
  position: absolute;
  bottom: -60px;
  display: block;
  width: 22px;
  height: 22px;
  border-radius: 6px;
  background-color: rgba(59, 127, 242, .38);
  box-shadow: inset 0 0 0 1px rgba(59, 127, 242, .55);
  animation: bubble-up 16s linear infinite;
}
/* 深色底反过来：气泡要比背景亮才看得见，换成更亮的蓝 */
html[data-theme="dark"] .bubble-bgwall li,
body.dark .bubble-bgwall li {
  background-color: rgba(125, 179, 255, .30);
  box-shadow: inset 0 0 0 1px rgba(125, 179, 255, .48);
}

.bubble-bgwall li:nth-child(1)  { left: 10%; animation-duration: 15s; }
.bubble-bgwall li:nth-child(2)  { left: 20%; width: 34px; height: 34px; animation-duration: 11s; animation-delay: 2s; }
.bubble-bgwall li:nth-child(3)  { left: 25%; animation-duration: 13s; animation-delay: 4s; }
.bubble-bgwall li:nth-child(4)  { left: 40%; width: 28px; height: 28px; animation-duration: 9s; }
.bubble-bgwall li:nth-child(5)  { left: 70%; animation-duration: 14s; animation-delay: 1s; }
.bubble-bgwall li:nth-child(6)  { left: 80%; width: 40px; height: 40px; animation-duration: 12s; animation-delay: 3s; }
.bubble-bgwall li:nth-child(7)  { left: 32%; width: 46px; height: 46px; animation-duration: 17s; animation-delay: 2s; }
.bubble-bgwall li:nth-child(8)  { left: 55%; width: 18px; height: 18px; animation-duration: 15s; animation-delay: 4s; }
.bubble-bgwall li:nth-child(9)  { left: 25%; width: 20px; height: 20px; animation-duration: 12s; animation-delay: 2s; }
.bubble-bgwall li:nth-child(10) { left: 85%; width: 44px; height: 44px; animation-duration: 16s; animation-delay: 5s; }

@keyframes bubble-up {
  0%   { opacity: 0;   transform: translateY(0)      rotate(0deg); }
  15%  { opacity: .65; }
  50%  { opacity: .85; transform: translateY(-55vh)  rotate(90deg); }
  100% { opacity: 0;   transform: translateY(-110vh) rotate(180deg); }
}
/* 让 Hero 里原有内容浮在气泡之上 */
.hero > *:not(.bubble-bgwall) { position: relative; z-index: 1; }

/* ---------- 5. 浮出面板：毛玻璃 + 四角 + 入场动画 ---------- */
/* 只作用于"自己本来就在最上层"的浮出面板。
   这里加 transform / backdrop-filter 是安全的：它们是层叠的终点，
   内部没有还要再往外浮的子节点（对比上面 #topbar 那个坑）。
   入场动画参考样式库「实现modal弹框动画」的位移+淡入思路。 */
.top-menu,
.modal-box,
.dropdown {
  -webkit-backdrop-filter: blur(18px) saturate(170%);
  backdrop-filter: blur(18px) saturate(170%);
}
html[data-theme="dark"] .top-menu,
html[data-theme="dark"] .modal-box,
html[data-theme="dark"] .dropdown,
body.dark .top-menu,
body.dark .modal-box,
body.dark .dropdown {
  background: rgba(23, 27, 34, .88);
}

/* 四角装饰直接画在浮出面板上（不必等 JS 加 .corner-box） */
.top-menu::before,
.modal-box::before {
  content: "";
  position: absolute;
  inset: 0;
  pointer-events: none;
  border-radius: inherit;
  --c: var(--brand, #3b7ff2);
  background:
    linear-gradient(var(--c), var(--c)) 0    0    / 12px 1px no-repeat,
    linear-gradient(var(--c), var(--c)) 0    0    / 1px 12px no-repeat,
    linear-gradient(var(--c), var(--c)) 100% 0    / 12px 1px no-repeat,
    linear-gradient(var(--c), var(--c)) 100% 0    / 1px 12px no-repeat,
    linear-gradient(var(--c), var(--c)) 0    100% / 12px 1px no-repeat,
    linear-gradient(var(--c), var(--c)) 0    100% / 1px 12px no-repeat,
    linear-gradient(var(--c), var(--c)) 100% 100% / 12px 1px no-repeat,
    linear-gradient(var(--c), var(--c)) 100% 100% / 1px 12px no-repeat;
  opacity: .45;
}

@keyframes fx-pop-in {
  from { opacity: 0; transform: translateY(-6px) scale(.985); }
  to   { opacity: 1; transform: none; }
}
.top-menu.open,
.modal-box,
.dropdown {
  animation: fx-pop-in .16s ease-out;
}

/* ---------- 6. 编辑区两层对齐的加固（预防性，非已验证修复）---------- */
/* Code 的编辑区是「透明 textarea 盖在高亮 div 上」的双层结构，两层必须
   用完全相同的字号/行高渲染，否则每行的偏差会累积 —— 表现为点第 8 行却
   输入到第 9 行，而行号槽还停在第 8 行。

   本环境实测（Chromium，桌面 1280 与手机 390 视口、14/20px、换行开关）
   两层逐行扫描全部对齐，复现不出来：因为默认文本缩放是 100%。
   真机上若开了系统「字体大小 / 网页文字缩放」，div 与 textarea 可能被按
   不同倍率放大，偏差就从第 8、9 行开始显形。
   这里把自动缩放锁死，强制两层用同一个倍率。代价是编辑器不跟随系统字号
   缩放 —— 对代码编辑区是合理的，代码需要精确对齐优先于可读性缩放。 */
#editor, #highlight {
  -webkit-text-size-adjust: 100%;
  text-size-adjust: 100%;
}

/* ---------- 7. 尊重系统的减弱动效偏好 ---------- */
@media (prefers-reduced-motion: reduce) {
  .bubble-bgwall { display: none; }
  .corner-box::before,
  .top-menu::before,
  .modal-box::before { transition: none; }
  .top-menu.open,
  .modal-box,
  .dropdown { animation: none; }
}
/* FX-PLUS-END */

</style>
</head>
<body>

<nav class="nav">
  <div class="nav-inner">
    <a class="logo" href="index.html">项目主页</a>
    <div class="nav-links"><a href="index.html">返回首页</a></div>
    <div id="acctHost" class="acct-host"></div>
  </div>
</nav>

<div class="ac-wrap">
  <div id="gate" class="gate">正在检查登录状态…</div>
  <div id="body" hidden>

    <!-- ── 头像 ───────────────────────────────────────── -->
    <div class="ac-card">
      <h2 class="ac-h">头像</h2>
      <p class="ac-sub">存在服务端，换设备、换项目都在。不设就用昵称首字生成的彩色圆。</p>
      <div class="av-row">
        <div id="avPrev" class="av-prev">?</div>
        <div class="av-acts">
          <button class="btn-ghost" id="btnPick">选择图片…</button>
          <button class="btn-ghost" id="btnClear">恢复为默认</button>
        </div>
      </div>
      <input type="file" id="file" accept="image/*" hidden>
      <div class="msg" id="avMsg"></div>
      <div class="note-warn" id="avNote" hidden>
        图片会上传到公共存储，任何人拿到链接都能看。别用含个人敏感信息的图。
      </div>
    </div>

    <!-- ── 资料 ───────────────────────────────────────── -->
    <div class="ac-card">
      <h2 class="ac-h">资料</h2>
      <p class="ac-sub">改昵称会立刻在全站生效。</p>
      <label class="field-label" for="fNick">昵称</label>
      <input class="field" id="fNick">
      <label class="field-label" for="fBio">简介</label>
      <textarea class="field" id="fBio"></textarea>
      <button class="btn-primary" id="btnSave">保存资料</button>
      <div class="msg" id="pMsg"></div>
    </div>

    <!-- ── 密码 ───────────────────────────────────────── -->
    <div class="ac-card">
      <h2 class="ac-h">修改密码</h2>
      <p class="ac-sub">改密码会让<b>所有设备上的登录失效</b>，需要重新登录。</p>
      <label class="field-label" for="fOld">原密码</label>
      <input class="field" id="fOld" type="password">
      <label class="field-label" for="fNew">新密码（至少 4 位）</label>
      <input class="field" id="fNew" type="password">
      <button class="btn-primary" id="btnPwd">修改密码</button>
      <div class="msg" id="wMsg"></div>
    </div>

    <!-- ── 审核（仅管理员可见）─────────────────────────── -->
    <div class="ac-card" id="revCard" hidden>
      <h2 class="ac-h">注册审核</h2>
      <p class="ac-sub">通过后才可登录。驳回的人仍保留在列表里，可再次通过。</p>
      <div id="revList"><div class="empty">加载中…</div></div>
      <div class="msg" id="rMsg"></div>
    </div>

  </div>
</div>

<script src="assets/identity.js"></script>
<script>
/* ================================================================
   account.html —— 全站账号设置（Q-Chat-S-123）

   为什么这个页在集群层而不是项目里：
     账号不归任何单个项目，所以设置页也不该长在项目里。
     否则在主页改了昵称，聊天室要等下次同步才看得到，
     用户会以为"改了没生效"。同一份资料两个地方改，必然漂移。

   本页不实现业务逻辑，全部调用 SiteIdentity → 服务端 RPC。
================================================================ */

(function () {
  'use strict';
  var SI = window.SiteIdentity;
  var $ = function (id) { return document.getElementById(id); };

  function msg(el, text, ok) {
    el.textContent = text || '';
    el.className = 'msg' + (text ? (ok ? ' msg-ok' : ' msg-err') : '');
  }

  /* 头像预览：与 identity.js 的 avatarEl 同算法（首字 + 昵称哈希色相）。
     用自己的容器而不是复用 avatarEl，是因为这里要 56px 且能换背景图。 */
  function drawPrev(nick, url) {
    var p = $('avPrev');
    var name = nick || '?';
    var hue = 0;
    for (var i = 0; i < name.length; i++) hue = (hue * 31 + name.charCodeAt(i)) % 360;
    p.style.backgroundColor = 'hsl(' + hue + ',52%,52%)';
    p.style.backgroundImage = url ? 'url(' + url + ')' : '';
    p.textContent = url ? '' : String(name).trim().slice(0, 1).toUpperCase();
  }

  function drawProfile(st) {
    $('fNick').value = st.nick || '';
    $('fBio').value = st.bio || '';
    drawPrev(st.nick, st.avatar);
  }

  /* ---------------- 审核队列 ---------------- */

  function loadReview() {
    var box = $('revList');
    SI.listUsers('pending').then(function (r) {
      var list = (r && r.users) || [];
      box.innerHTML = '';
      if (!list.length) {
        box.innerHTML = '<div class="empty">没有待审核的申请</div>';
        return;
      }
      list.forEach(function (u) {
        var row = document.createElement('div');
        row.className = 'rev-item';

        var av = SI.avatarEl(u.nick, u.role);
        row.appendChild(av);

        var main = document.createElement('div');
        main.className = 'rev-main';
        var nm = document.createElement('div');
        nm.className = 'rev-nick';
        nm.textContent = u.nick;
        main.appendChild(nm);
        /* ⚠ 申请说明（real_name）只有管理员拿得到 ——
           服务端 user_list 对普通成员返回 null。
           这里能显示，说明当前确实是管理员。 */
        if (u.note) {
          var nt = document.createElement('div');
          nt.className = 'rev-note';
          nt.textContent = '申请说明：' + u.note;
          main.appendChild(nt);
        }
        row.appendChild(main);

        var acts = document.createElement('div');
        acts.className = 'rev-acts';

        var ok = document.createElement('button');
        ok.className = 'rev-ok';
        ok.textContent = '通过';
        ok.onclick = function () {
          ok.disabled = true; ok.textContent = '…';
          SI.review(u.id, 'active').then(function () {
            msg($('rMsg'), '已通过：' + u.nick, true);
            loadReview();
          }).catch(function (e) {
            msg($('rMsg'), '失败：' + (e && e.message ? e.message : '网络错误'), false);
            ok.disabled = false; ok.textContent = '通过';
          });
        };

        var no = document.createElement('button');
        no.className = 'rev-no';
        no.textContent = '驳回';
        no.onclick = function () {
          no.disabled = true; no.textContent = '…';
          /* 驳回 = 保持 pending 还是 banned？
             这里**不用 banned** —— banned 是"曾通过、后被封"，
             一个从没进过站的人被标成 banned 会混进封禁名单，
             以后统计"封禁人数"就不准了。驳回就留在 pending。 */
          SI.review(u.id, 'pending').then(function () {
            msg($('rMsg'), '已驳回（保留在待审核列表）：' + u.nick, true);
            loadReview();
          }).catch(function (e) {
            msg($('rMsg'), '失败：' + (e && e.message ? e.message : '网络错误'), false);
            no.disabled = false; no.textContent = '驳回';
          });
        };

        acts.appendChild(ok); acts.appendChild(no);
        row.appendChild(acts);
        box.appendChild(row);
      });
    }).catch(function (e) {
      box.innerHTML = '<div class="empty">加载失败：' +
        (e && e.message ? e.message : '网络错误') + '</div>';
    });
  }

  /* ---------------- 事件 ---------------- */

  function bind() {
    $('btnPick').onclick = function () { $('file').click(); };

    $('file').onchange = function () {
      var f = this.files && this.files[0];
      if (!f) return;
      /* 头像不需要原图那么大：缩到 256px 再传。
         不压缩的话一张手机照片 4MB，上传慢、存储贵，
         而头像显示尺寸只有几十像素。 */
      var b = $('btnPick');
      b.disabled = true; b.textContent = '上传中…';
      msg($('avMsg'), '');
      shrink(f, 256).then(function (blob) {
        return SI.uploadAvatar(blob, 'image/png');
      }).then(function (url) {
        return SI.profileUpdate({ avatar: url });
      }).then(function (st) {
        drawPrev(st.nick, st.avatar);
        msg($('avMsg'), '头像已更新', true);
        b.disabled = false; b.textContent = '选择图片…';
      }).catch(function (e) {
        msg($('avMsg'), '失败：' + (e && e.message ? e.message : '网络错误'), false);
        b.disabled = false; b.textContent = '选择图片…';
      });
      this.value = '';   /* 清空以便重选同一张图也能触发 change */
    };

    $('btnClear').onclick = function () {
      var b = this;
      b.disabled = true; b.textContent = '处理中…';
      /* ⚠ 传 '' 而不是 null —— 服务端用 case when p_avatar='' 判定清空。
         传 null 会被当成"没传"，头像永远删不掉。 */
      SI.profileUpdate({ avatar: '' }).then(function (st) {
        drawPrev(st.nick, st.avatar);
        msg($('avMsg'), '已恢复为默认头像', true);
        b.disabled = false; b.textContent = '恢复为默认';
      }).catch(function (e) {
        msg($('avMsg'), '失败：' + (e && e.message ? e.message : '网络错误'), false);
        b.disabled = false; b.textContent = '恢复为默认';
      });
    };

    $('btnSave').onclick = function () {
      var b = this;
      var nick = $('fNick').value.trim();
      if (!nick) { msg($('pMsg'), '昵称不能为空', false); return; }
      b.disabled = true; b.textContent = '保存中…';
      SI.profileUpdate({ nick: nick, bio: $('fBio').value.trim() })
        .then(function (st) {
          drawPrev(st.nick, st.avatar);
          msg($('pMsg'), '已保存', true);
          b.disabled = false; b.textContent = '保存资料';
        })
        .catch(function (e) {
          msg($('pMsg'), '失败：' + (e && e.message ? e.message : '网络错误'), false);
          b.disabled = false; b.textContent = '保存资料';
        });
    };

    $('btnPwd').onclick = function () {
      var b = this;
      var o = $('fOld').value, n = $('fNew').value;
      if (!o || !n) { msg($('wMsg'), '请填写原密码和新密码', false); return; }
      if (n.length < 4) { msg($('wMsg'), '新密码至少 4 位', false); return; }
      b.disabled = true; b.textContent = '提交中…';
      SI.changePassword(o, n).then(function () {
        msg($('wMsg'), '密码已修改。所有设备需重新登录。', true);
        $('fOld').value = ''; $('fNew').value = '';
        b.disabled = false; b.textContent = '修改密码';
      }).catch(function (e) {
        msg($('wMsg'), '失败：' + (e && e.message ? e.message : '网络错误'), false);
        b.disabled = false; b.textContent = '修改密码';
      });
    };
  }

  /* 图片缩到 maxPx 再转 PNG */
  function shrink(file, maxPx) {
    return new Promise(function (res, rej) {
      var img = new Image();
      var url = URL.createObjectURL(file);
      img.onload = function () {
        URL.revokeObjectURL(url);
        var s = Math.min(1, maxPx / Math.max(img.width, img.height));
        var c = document.createElement('canvas');
        c.width = Math.round(img.width * s);
        c.height = Math.round(img.height * s);
        c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
        c.toBlob(function (b) {
          if (b) res(b); else rej(new Error('图片处理失败'));
        }, 'image/png');
      };
      img.onerror = function () { URL.revokeObjectURL(url); rej(new Error('图片读取失败')); };
      img.src = url;
    });
  }

  /* ---------------- 启动 ---------------- */

  SI.ready.then(function (st) {
    if (!st || !st.ok) {
      $('gate').innerHTML = st && st.offline
        ? '连不上服务器，无法加载账号设置。'
        : '需要先登录。<a href="login.html?next=' +
          encodeURIComponent('account.html') + '">去登录 →</a>';
      return;
    }
    $('gate').hidden = true;
    $('body').hidden = false;
    drawProfile(st);
    $('avNote').hidden = false;
    bind();

    /* 审核区只给管理员 —— 但真正的闸门在服务端 user_list / user_review，
       这里只是"不显示"。改 CSS 让隐藏的卡片显出来也没用，
       服务端会直接拒绝。 */
    if (st.role === 'owner' || st.role === 'admin') {
      $('revCard').hidden = false;
      loadReview();
    }

    /* 头像改了、昵称改了，别的标签页也要跟着变 ——
       identity.js 的 storage 事件只监听令牌，资料变更靠这里刷。 */
    SI.onChange(function (s2) { if (s2 && s2.ok) drawPrev(s2.nick, s2.avatar); });
  });

  SI.mount($('acctHost'));
})();
</script>
<script>
/* ==========================================================================
   fx-plus.js · 为 fx-plus.css 注入效果所需 DOM
   引用自样式库：liuyiming2024/css_effect_map_collection
     · 滚动指示器  → 顶部进度条
     · 纯css气泡背景 → Hero 区气泡 <ul><li>
     · css边框四角  → 给 .card 加 .corner-box

   刻意不碰主题：各站点已有自己的亮暗切换（Cloud / Code 用
   [data-theme="dark"]，Chat / 主页用 body.dark），这里不接管、
   不创建第二个切换按钮、不写 localStorage 的主题键。
   ========================================================================== */
(function () {
  "use strict";

  function boot() {
    injectProgressBar();
    injectBubbles();
    markCorners();
    bindScroll();
  }
  if (document.readyState === "loading") {
    document.addEventListener("DOMContentLoaded", boot);
  } else {
    boot();
  }

  /* ---- 滚动指示器（样式库：滚动指示器） ---- */
  function injectProgressBar() {
    if (document.getElementById("scroll-progress")) return;
    var bar = document.createElement("div");
    bar.id = "scroll-progress";
    document.body.appendChild(bar);
  }
  function bindScroll() {
    var bar = document.getElementById("scroll-progress");
    if (!bar) return;
    var ticking = false;
    function update() {
      var h = document.documentElement.scrollHeight - window.innerHeight;
      var pct = h > 0 ? Math.min(100, (window.scrollY / h) * 100) : 0;
      bar.style.width = pct.toFixed(2) + "%";
      ticking = false;
    }
    function onScroll() {
      if (!ticking) { ticking = true; window.requestAnimationFrame(update); }
    }
    window.addEventListener("scroll", onScroll, { passive: true });
    window.addEventListener("resize", onScroll, { passive: true });
    update();
  }

  /* ---- 气泡背景（样式库：纯css气泡背景） ---- */
  function injectBubbles() {
    var hero = document.querySelector(".hero");
    if (!hero || hero.querySelector(".bubble-bgwall")) return;
    var ul = document.createElement("ul");
    ul.className = "bubble-bgwall";
    ul.setAttribute("aria-hidden", "true");
    for (var i = 0; i < 10; i++) ul.appendChild(document.createElement("li"));
    hero.insertBefore(ul, hero.firstChild);
  }

  /* ---- 四角装饰（样式库：css边框四角），只作用于卡片 ---- */
  function markCorners() {
    var cards = document.querySelectorAll(".card");
    for (var i = 0; i < cards.length; i++) cards[i].classList.add("corner-box");
  }
})();

</script>
</body>
