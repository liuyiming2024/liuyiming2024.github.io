<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
    <!-- Q-Chat-S-131（外部报告 F-2）：内容安全策略。
         GitHub Pages 设不了 HTTP 响应头，只能用 meta 标签 ——
         它能覆盖绝大多数指令（frame-ancestors / report-uri 除外）。

         作用：页面被注入外部脚本时，浏览器直接拒绝加载。
         本站无任何第三方 JS 依赖，所以 default-src 'self' 就够了。

         ⚠ 为什么 script-src 保留了 'unsafe-inline'：
            这些页面都有内联 <script> 初始化代码（共 7 处）。
            要去掉它得改用 nonce 或 hash，而 hash 每次改代码都要重算 ——
            维护性差，容易在改完后静默失效（脚本被拦、页面白屏）。
            保留 'unsafe-inline' **仍能挡住外部域的脚本注入**，
            那是 XSS 的主要危害形式；内联代码是我们自己写的，不是注入的。

         ⚠ connect-src 必须放行 Supabase —— 身份服务要调它。
            写成 'self' 的话登录/权限页直接全部失效。
         ⚠ img-src 要放行 data:/blob: —— 头像是 canvas 生成的 data URL。 -->
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; connect-src 'self' https://pimryrsxkwyafmponegp.supabase.co; font-src 'self' data:; base-uri 'self'; form-action 'self'">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>登录 · 全站统一账号</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%233b7ff2'/%3E%3Cpath d='M8 11h16M8 16h11' stroke='%23fff' stroke-width='2.4' stroke-linecap='round'/%3E%3C/svg%3E">
<style>
/* __INLINED__ 由 assets/style.css 生成，勿手改；改样式请改源文件后重跑 inline-css.py */
/* ==================================================================
 * 个人主页样式 —— 无外部依赖，全部使用系统字体
 * ================================================================== */
:root{
  --brand:#3b7ff2; --brand-dark:#2f6ad6; --brand-soft:#eaf2ff;
  --bg:#f4f6f9; --panel:#fff; --text:#1f2329; --dim:#6b7280;
  --border:#e5e8ec; --radius:10px;
}
body.dark{
  --brand:#4d8bf5; --brand-dark:#3b7ff2; --brand-soft:#1b2735;
  --bg:#101216; --panel:#171a1f; --text:#e6e6e6; --dim:#9aa0a6;
  --border:#2a2e35;
}
*{box-sizing:border-box}
body{
  margin:0; background:var(--bg); color:var(--text);
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
  font-size:15px; line-height:1.75; -webkit-text-size-adjust:100%;
}
a{color:var(--brand);text-decoration:none}
a:hover{text-decoration:underline}
code{background:var(--brand-soft);padding:1px 5px;border-radius:3px;font-family:ui-monospace,Menlo,Consolas,monospace;font-size:.9em}

/* 账号区（Q-Site-S-121）────────────────────────────────
   由 assets/identity.js 渲染。类名必须与 Chat/assets/site.css 那份
   完全一致：两边共用同一个脚本、同一套类，改一处就够。
   ⚠ 上次漏加了这一整段，账号区在页面上裸奔（无高宽、无头像圆形），
     而断言只检查了 index.html 有容器 —— "容器在、样式没加"抓不到。
     所以这次把 .acct-host 也写进锚点，两边一起验。 */
.acct-host { display: flex; align-items: center; gap: 8px; }
.acct-box  { display: flex; align-items: center; gap: 7px; }
.acct-av {
  width: 26px; height: 26px; border-radius: 50%;
  display: inline-flex; align-items: center; justify-content: center;
  color: #fff; font-size: 12px; font-weight: 600; flex: none;
  background-color: #8c8c8c;   /* 首字可能是 emoji，兜底防透明圆 */
}
.acct-owner { box-shadow: 0 0 0 2px var(--brand); }
.acct-admin { box-shadow: 0 0 0 2px var(--border); }
.acct-name { font-size: 13px; font-weight: 500; max-width: 90px;
             overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.acct-role { font-size: 11px; padding: 1px 6px; border-radius: 4px;
             background: var(--brand-soft); color: var(--brand-dark); flex: none; }
/* 待审核 / 已封禁必须与正常角色视觉分开：
   登了录却什么都用不了，界面不说，用户只会以为站点坏了。 */
.acct-pending { background: #fff3cd; color: #8a6100; }
.acct-btn {
  font-size: 12px; padding: 4px 10px; border-radius: 6px;
  border: 1px solid var(--border); background: var(--panel); color: var(--text);
  text-decoration: none; cursor: pointer; flex: none; font-family: inherit;
}
.acct-btn:hover { border-color: var(--brand); color: var(--brand); }
.acct-out { border-color: transparent; background: transparent; color: var(--dim); padding: 4px 6px; }
.acct-out:hover { color: #d93025; }
.acct-off { opacity: .65; cursor: default; }
@media (max-width: 560px) { .acct-name, .acct-role { display: none; } }

/* 导航 */
.nav{background:var(--panel);border-bottom:1px solid var(--border);position:sticky;top:0;z-index:50}
.nav-inner{max-width:1000px;margin:0 auto;padding:0 16px;height:56px;display:flex;align-items:center;gap:18px}
.logo{font-size:16px;font-weight:700;color:var(--text);white-space:nowrap}
.logo:hover{text-decoration:none}
.nav-links{display:flex;gap:4px;flex:1}
.nav-links a{padding:6px 12px;border-radius:6px;color:var(--text);font-size:14px}
.nav-links a:hover{background:var(--brand-soft);text-decoration:none}
.icon-btn{border:1px solid var(--border);background:var(--panel);color:var(--text);border-radius:6px;
  width:32px;height:32px;cursor:pointer;font-size:14px;display:flex;align-items:center;justify-content:center}
.icon-btn:hover{border-color:var(--brand);color:var(--brand)}

/* 容器 */
.wrap{max-width:1000px;margin:0 auto;padding:28px 16px 60px}
section{margin-bottom:38px;scroll-margin-top:70px}
h2{font-size:20px;margin:0 0 14px;padding-left:10px;border-left:4px solid var(--brand)}

/* Hero */
.hero{background:linear-gradient(135deg,var(--brand),#2f6ad6);color:#fff;
  border-radius:14px;padding:48px 34px;margin-bottom:34px}
.hero h1{margin:0 0 8px;font-size:32px;line-height:1.35}
.hero .sub{margin:0 0 18px;opacity:.93;font-size:15.5px}
.hero-btns{display:flex;gap:10px;flex-wrap:wrap}
.btn{display:inline-block;padding:9px 20px;border-radius:6px;font-size:14px;cursor:pointer;transition:.15s}
.btn:hover{text-decoration:none;opacity:.9}
.btn-primary{background:#fff;color:var(--brand);font-weight:600}
.btn-ghost{background:rgba(255,255,255,.14);color:#fff;border:1px solid rgba(255,255,255,.4)}

/* 卡片 */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:14px}
.card{background:var(--panel);border:1px solid var(--border);border-radius:var(--radius);
  padding:18px;transition:.15s;display:block;color:inherit}
.card:hover{border-color:var(--brand);transform:translateY(-2px);text-decoration:none}
.card h3{margin:0 0 6px;font-size:15.5px}
.card p{margin:0;font-size:13.5px;color:var(--dim);line-height:1.65}
.card-icon{font-size:22px;margin-bottom:8px;display:block}

/* 标签 */
.tags{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
.tag{background:var(--brand-soft);color:var(--brand);padding:4px 12px;border-radius:14px;font-size:13px}

/* 关于 */
.panel{background:var(--panel);border:1px solid var(--border);border-radius:var(--radius);padding:22px}
.panel p{margin:0 0 12px}
.panel p:last-child{margin-bottom:0}

/* 时间线 */
.timeline{border-left:2px solid var(--border);padding-left:18px;margin-left:6px}
.tl-item{position:relative;padding-bottom:18px}
.tl-item::before{content:'';position:absolute;left:-25px;top:7px;width:10px;height:10px;
  border-radius:50%;background:var(--brand);border:2px solid var(--panel)}
.tl-date{font-size:12.5px;color:var(--dim)}
.tl-title{font-weight:600;font-size:15px;margin:1px 0 2px}
.tl-desc{font-size:13.5px;color:var(--dim)}

/* 页脚 */
.foot{border-top:1px solid var(--border);background:var(--panel);
  padding:26px 16px;text-align:center;color:var(--dim);font-size:13px}
.foot a{color:var(--dim)}

@media(max-width:720px){
  /* ⚠ Q-Site-S-139：原来这里只写了 gap 与 height，
     六个链接（项目/关于本站/手册/账号/权限/站点设置）仍被塞进同一行。
     实测 360px 视口下：nav-links 被压到 248px 宽、六个链接各 38px，
     "站点设置"四字在 38px 里必然溢出；nav-links 实际高 110px
     而 nav-inner 只有 52px —— 子元素向上溢出 y=-29，跑到可视区外。
     页面还因此产生横向滚动（scrollWidth 390 > 视口 360），能左右拖。

     ★ 修法：链接另起一行，横向可滑动。
       为什么不用汉堡菜单：那要写 JS、要管展开收起与点击外部关闭，
       而这个导航只有六个纯链接 —— 横向滑动更简单也更不容易坏。
       为什么不让它们换行成两三行：那会把内容区顶下去一大截，
       导航条占掉半个屏幕，比横向滑动难看得多。 */
  .nav-inner{gap:10px;height:auto;min-height:52px;flex-wrap:wrap;padding:8px 12px;row-gap:6px}
  .nav-links{order:3;flex:1 0 100%;overflow-x:auto;flex-wrap:nowrap;
    -webkit-overflow-scrolling:touch;scrollbar-width:none;padding-bottom:2px}
  .nav-links::-webkit-scrollbar{display:none}
  .nav-links a{flex:none;white-space:nowrap}
  .hero{padding:32px 20px}
  .hero h1{font-size:24px}
  .wrap{padding:18px 12px 40px}
}


/* ================= 线性图标 =================
 * 换掉 emoji：跨平台渲染不一致、深色模式下部分 emoji 自带颜色不跟主题变。
 * 本页的深色变量与 Chat 项目不是同一套，所以显式给 --icon 兜底，
 * 不纯靠继承父元素文字色 —— 否则深色下图标可能过暗看不见。 */
:root { --icon: #3b7ff2; }
body.dark { --icon: #7db3ff; }

.ic {
  width: 20px; height: 20px;
  display: inline-block;
  vertical-align: middle;
  flex: none;
  fill: none;
  stroke: currentColor;
  stroke-width: 1.8;
  stroke-linecap: round;
  stroke-linejoin: round;
}
.ic-sm { width: 16px; height: 16px; }
.ic-lg { width: 22px; height: 22px; }
.ic-fill { fill: currentColor; stroke: none; }

.card-icon {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  color: var(--icon);
  margin-bottom: 8px;
}
.card-icon .ic { width: 20px; height: 20px; }

.icon-btn { display: inline-flex; align-items: center; justify-content: center; }
.icon-btn .ic { width: 18px; height: 18px; }


/* 卡片：整张可点，但原来没有任何可点的暗示 */
.card-main { position: relative; }
.card-hit { display: block; color: inherit; text-decoration: none; }
.card-src { z-index: 2; }
.card-link {
  display: inline-block;
  margin-top: 10px;
  color: var(--icon);
  font-size: 13px;
  font-weight: 600;
}
.card-src {
  position: absolute;
  right: 12px; bottom: 12px;
  display: inline-flex; align-items: center; gap: 4px;
  font-size: 12px; color: #888; text-decoration: none;
  padding: 3px 8px; border-radius: 4px;
}
.card-src:hover { background: rgba(0,0,0,.06); color: var(--icon); }
body.dark .card-src:hover { background: rgba(255,255,255,.08); }
.card-src .ic { width: 14px; height: 14px; }
.card:hover { transform: translateY(-2px); }
</style>
<style>
  /* 本页专用：登录卡片居中。其余一律复用 assets/style.css，
     不另造一套配色 —— 换主题时登录页必须跟着变，

                align-items: center; justify-content: center; padding: 24px 16px; }
  .login-card { width: 100%; max-width: 360px; background: var(--panel);
                border: 1px solid var(--border); border-radius: var(--radius);
                padding: 26px 24px 22px; }
  .login-title { font-size: 20px; font-weight: 600; margin: 0 0 4px; }
  .login-sub { font-size: 13px; color: var(--dim); margin: 0 0 18px; }
  .field { width: 100%; box-sizing: border-box; padding: 9px 11px; font-size: 14px;
           border: 1px solid var(--border); border-radius: 6px;
           background: var(--bg); color: var(--text); font-family: inherit; }
  .field:focus { outline: 2px solid var(--brand); outline-offset: -1px; }
  .field-label { display: block; font-size: 12px; color: var(--dim); margin: 12px 0 5px; }
  .btn-primary { width: 100%; padding: 10px; font-size: 14px; font-weight: 500;
                 border: none; border-radius: 6px; background: var(--brand);
                 color: #fff; cursor: pointer; margin-top: 18px; font-family: inherit; }
  .btn-primary:hover { background: var(--brand-dark); }
  .btn-primary:disabled { opacity: .6; cursor: default; }
  .btn-ghost { width: 100%; padding: 8px; margin-top: 8px; font-size: 13px;
               border: 1px solid var(--border); border-radius: 6px;
               background: transparent; color: var(--dim); cursor: pointer; font-family: inherit; }
  .err { margin-top: 12px; font-size: 13px; color: #d93025; min-height: 18px; line-height: 1.5; }
  .tabs { display: flex; gap: 4px; margin-bottom: 6px; border-bottom: 1px solid var(--border); }
  .tab { flex: 1; padding: 8px 0; font-size: 13px; border: none; background: none;
         color: var(--dim); cursor: pointer; font-family: inherit;
         border-bottom: 2px solid transparent; margin-bottom: -1px; }
  .tab.on { color: var(--text); font-weight: 500; border-bottom-color: var(--brand); }
  .hint { font-size: 12px; color: var(--dim); margin-top: 14px; line-height: 1.7; }
  .hint a { color: var(--brand); text-decoration: none; }
  .who { display: flex; align-items: center; gap: 10px; margin-bottom: 8px; }
  .offline-note { font-size: 12px; color: #8a6100; background: #fff3cd;
                  border-radius: 6px; padding: 8px 10px; margin-bottom: 14px; line-height: 1.6; }
</style>

<body>

<nav class="nav">
  <div class="nav-inner">
    <a class="logo" href="index.html">项目主页</a>
    <div class="nav-links"><a href="index.html">返回首页</a></div>
    <div id="acctHost" class="acct-host"></div>
  </div>
</nav>

<div class="login-wrap">
  <div class="login-card">
    <h1 class="login-title">全站统一账号</h1>
    <p class="login-sub">一处登录，各项目通用</p>

    <div id="offlineNote" class="offline-note" hidden>
      连不上服务器。本页需要联网才能登录。
    </div>

    <div id="pane"></div>
    <div class="err" id="err"></div>

    <div class="hint">
      账号由聊天室系统管理，注册后需站长审核通过才能登录。
      忘记密码请联系站长重置。
    </div>
  </div>
</div>

<script src="assets/identity.js"></script>
<script>
/* ================================================================
   login.html —— 全站唯一的登录界面（Q-Site-S-121）

   为什么全站只有这一个：
     登录牵扯的东西太多（失败冻结 15 分钟 8 次、全局爆破闸门、
     两套凭据的区别、桌面版桥接票据），每个项目各做一份必然漂移。
     于是"同一个账号在 A 项目会被冻结、在 B 项目不会" ——
     安全边界取决于用户从哪个门进，这是不能接受的。

   ⚠ 本页不实现任何业务逻辑，只调用 SiteIdentity。
     所有规则都在服务端的 user_login / user_register 里。
================================================================ */

(function () {
  'use strict';
  var SI = window.SiteIdentity;
  var pane = document.getElementById('pane');
  var errBox = document.getElementById('err');

  /* ⚠ next 必须过白名单。identity.js 的 safeNext 只放行同源地址 ——
     否则这就是开放重定向：域名看着是你的，登录完送到钓鱼站去。 */
  var next = SI._safeNext(new URLSearchParams(location.search).get('next')) || 'index.html';

  function err(m) { errBox.textContent = m || ''; }

  function drawTabs(cur) {
    var t = document.createElement('div');
    t.className = 'tabs';
    ['login', 'reg'].forEach(function (k) {
      var b = document.createElement('button');
      b.className = 'tab' + (k === cur ? ' on' : '');
      b.type = 'button';
      b.textContent = k === 'login' ? '登录' : '注册';
      b.onclick = function () { draw(k); };
      t.appendChild(b);
    });
    return t;
  }

  function field(label, id, type) {
    var l = document.createElement('label');
    l.className = 'field-label';
    l.setAttribute('for', id);
    l.textContent = label;
    var i = document.createElement('input');
    i.className = 'field';
    i.id = id;
    if (type) i.type = type;
    return [l, i];
  }

  function btn(text, fn, ghost) {
    var b = document.createElement('button');
    b.className = ghost ? 'btn-ghost' : 'btn-primary';
    b.type = 'button';
    b.textContent = text;
    b.onclick = fn;
    return b;
  }

  function draw(mode) {
    pane.innerHTML = '';
    err('');

    /* 已登录：不显示表单，显示身份 + 回去 / 换人。
       ⚠ 不能让已登录的人再登录一次 —— 那会签发第二张令牌，
       而"退出"只清当前持有的那张，另一张在服务端仍然有效。 */
    var st = SI.state;
    if (st.ok) {
      var w = document.createElement('div');
      w.className = 'who';
      w.appendChild(SI.avatarEl(st.nick, st.role));
      var s = document.createElement('span');
      s.textContent = '已登录：' + st.nick +
        (st.status && st.status !== 'active' ? '（' + st.status + '）' : '');
      w.appendChild(s);
      pane.appendChild(w);
      pane.appendChild(btn('继续前往 →', function () { location.href = next; }));
      /* 集群层的账号设置入口（Q-Chat-S-123） */
      pane.appendChild(btn('账号设置', function () { location.href = 'account.html'; }, true));
      pane.appendChild(btn('退出并用其他账号登录', function () {
        SI.logout().then(function () { draw(mode); });
      }, true));
      return;
    }

    pane.appendChild(drawTabs(mode || 'login'));

    if ((mode || 'login') === 'login') {
      var f1 = field('昵称', 'lNick');
      var f2 = field('登录密码', 'lPwd', 'password');
      pane.appendChild(f1[0]); pane.appendChild(f1[1]);
      pane.appendChild(f2[0]); pane.appendChild(f2[1]);

      var ok = btn('登录', function () {
        var n = f1[1].value.trim(), p = f2[1].value;
        if (!n || !p) { err('请填写昵称和密码'); return; }
        ok.disabled = true; ok.textContent = '登录中…'; err('');
        SI.login(n, p).then(function () {
          location.href = next;
        }).catch(function (e) {
          /* ⚠ 服务端已经刻意让"昵称不存在"与"密码错误"返回同一句话
             （否则能凭报错枚举出哪些昵称注册过）。这里原样展示即可。 */
          err(e && e.message ? e.message : '登录失败');
          ok.disabled = false; ok.textContent = '登录';
        });
      });
      pane.appendChild(ok);
      /* 回车提交：不接的话，用户填完密码按回车毫无反应，
         会以为按钮坏了 —— 而这是最自然的登录动作。 */
      f2[1].addEventListener('keydown', function (e) {
        if (e.key === 'Enter' && !ok.disabled) ok.click();
      });
      f1[1].focus();

    } else {
      var g1 = field('昵称', 'rNick');
      var g2 = field('申请说明（可选，仅站长可见）', 'rNote');
      var g3 = field('密码', 'rPwd', 'password');
      pane.appendChild(g1[0]); pane.appendChild(g1[1]);
      pane.appendChild(g2[0]); pane.appendChild(g2[1]);
      pane.appendChild(g3[0]); pane.appendChild(g3[1]);

      var rb = btn('提交注册申请', function () {
        var n = g1[1].value.trim(), p = g3[1].value;
        if (!n || !p) { err('请填写昵称和密码'); return; }
        rb.disabled = true; rb.textContent = '提交中…'; err('');
        SI.register(n, g2[1].value.trim(), p).then(function (r) {
          if (r && r.ok === false) { err(r.err || '注册失败'); rb.disabled = false; rb.textContent = '提交注册申请'; return; }
          err('');
          pane.innerHTML = '';
          var d = document.createElement('div');
          d.className = 'hint';
          d.textContent = '已提交。需站长审核通过后才能登录，审核期间用这个昵称登录会提示"账号待审核"。';
          pane.appendChild(d);
          pane.appendChild(btn('返回登录', function () { draw('login'); }, true));
        }).catch(function (e) {
          err(e && e.message ? e.message : '注册失败');
          rb.disabled = false; rb.textContent = '提交注册申请';
        });
      });
      pane.appendChild(rb);
      g1[1].focus();
    }
  }

  /* 启动 */
  SI.ready.then(function (st) {
    if (st && st.offline) document.getElementById('offlineNote').hidden = false;
    draw('login');
  });
  SI.mount(document.getElementById('acctHost'));
})();
</script>
</body>
</html>
